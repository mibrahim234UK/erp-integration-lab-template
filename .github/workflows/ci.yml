name: CI

on:
  # No `paths` filter here on purpose: `validate` is a REQUIRED check.
  # If a path filter skipped this workflow, the required check would stay
  # "Pending" and block the merge. Use path filters only on optional checks.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # This job name is what a ruleset's required status check refers to.
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate mappings and Markdown links
        run: node scripts/validate.mjs
