name: Release

# Runs when you push a version tag such as v1.1.0.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # needed to create the release and upload its asset

jobs:
  release:
    name: package-and-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate before releasing
        run: node scripts/validate.mjs

      - name: Package mappings and docs
        run: |
          mkdir -p dist
          zip -r "dist/mapping-pack-${GITHUB_REF_NAME}.zip" mappings docs README.md LICENSE

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/mapping-pack-${GITHUB_REF_NAME}.zip" \
            --title "Mapping pack $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
