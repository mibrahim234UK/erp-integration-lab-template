# Groups automatically generated release notes by pull request label.
changelog:
  exclude:
    labels:
      - skip-release-notes
  categories:
    - title: Mapping changes
      labels:
        - mapping
    - title: Fixes
      labels:
        - defect
    - title: Documentation
      labels:
        - documentation
    - title: Automation and dependencies
      labels:
        - automation
        - dependencies
    - title: Other changes
      labels:
        - "*"
