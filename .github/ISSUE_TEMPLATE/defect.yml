name: Defect
description: Something produces the wrong result.
title: "[Defect]: "
labels: ["defect"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Use mapping MAP-INV-001
        2. Send a line with ordered 10, invoiced 4
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical - wrong financial result
        - Major - workaround exists
        - Minor - cosmetic or documentation
    validations:
      required: true
